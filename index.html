<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario Dental</title>
<meta name="description" content="Inventario de insumos para clínicas dentales">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#163f5c">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventario">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="figtree.css">
<style>
/* VOICE everyday clinical tool: calm, exact, quietly warm
   IDEA the labelled supply drawer of each clinic, where every insumo is one tooth on the chart
   PICTURE a strip of teeth, one per insumo, coloured by stock: coral bajo el mínimo, amber en el mínimo, blue-green sobre
   COLOUR porcelain ground, deep sea-blue band and ink, soft blue-green support, coral alarm
   TYPE Figtree 800 titles + Figtree text
   LAYOUT one 880px column; phone: band with clinic and teeth, alarm, exports, pinned search, list */
:root{color-scheme:light;--bg:#f5f1eb;--sf:#fffdf9;--sf2:#ece6dd;--ink:#0f2738;--mut:#52677a;--line:#dcd4c8;--band:#163f5c;--bandInk:#f5f1eb;--bandMut:#a9c3d3;--pri:#163f5c;--priInk:#ffffff;--priS:#e1ebf1;--ok:#1f6e68;--okS:#d5ebe7;--amb:#8a5a06;--ambS:#f7e9c6;--red:#b42a20;--redS:#f8dfda;--tOk:#7ec8bd;--tAt:#f2c14e;--tLow:#ff8c7c;--tNone:#5a7a8f;--bar:#2b8a83}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0b1720;--sf:#11222e;--sf2:#173041;--ink:#e3edf2;--mut:#9ab0bf;--line:#24404f;--band:#0f2c40;--bandInk:#e3edf2;--bandMut:#8fb0c3;--pri:#8fcfe0;--priInk:#08141b;--priS:#16364a;--ok:#5cc3b6;--okS:#143634;--amb:#efb748;--ambS:#382c12;--red:#ff7f72;--redS:#3f1f1c;--bar:#5cc3b6}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0b1720;--sf:#11222e;--sf2:#173041;--ink:#e3edf2;--mut:#9ab0bf;--line:#24404f;--band:#0f2c40;--bandInk:#e3edf2;--bandMut:#8fb0c3;--pri:#8fcfe0;--priInk:#08141b;--priS:#16364a;--ok:#5cc3b6;--okS:#143634;--amb:#efb748;--ambS:#382c12;--red:#ff7f72;--redS:#3f1f1c;--bar:#5cc3b6}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:140px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--bar);outline-offset:2px}
svg{display:block}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nw{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mk{width:34px;height:34px;border-radius:10px;background:var(--bandInk);color:var(--band);display:grid;place-items:center;flex:none}
.mk svg{width:22px;height:22px;fill:currentColor}
.top{position:sticky;top:0;z-index:20;background:var(--band);color:var(--bandInk);padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.top-in{max-width:848px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.bt b{display:block;font-size:17px;line-height:1.1}
.bt span{display:block;font-size:13px;color:var(--bandMut);line-height:1.25;overflow-wrap:anywhere}
.backb{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px 0 2px;margin-right:auto;border:0;border-radius:12px;background:transparent;color:var(--bandInk);font-weight:700;font-size:16px}
.backb:hover{background:rgba(255,255,255,.1)}
.save{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--bandMut);white-space:nowrap;background:none;border:0;padding:6px 4px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--tOk)}
.save.pend i{background:var(--tAt)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:inherit;display:grid;place-items:center;flex:none}
.top .iconbtn:hover{background:rgba(255,255,255,.1)}
.wrap{max-width:880px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
h1{font-size:clamp(32px,5.4vw,44px);line-height:1.05;letter-spacing:-.02em;font-weight:800;margin:0 0 10px;text-wrap:balance;overflow-wrap:anywhere}
h2{font-size:20px;line-height:1.2;margin:28px 0 12px;font-weight:700;letter-spacing:-.01em}
h3{font-size:17px;line-height:1.25;margin:0;font-weight:700}
.lead{font-size:17px;color:var(--mut);margin:0 0 20px;max-width:62ch}
.lead b{color:var(--ink)}
.note{font-size:14px;color:var(--mut);margin:12px 0 0}
.note b{color:var(--ink)}
.err{font-size:14px;color:var(--red);font-weight:600;margin:8px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;border:0;background:var(--pri);color:var(--priInk);font-weight:700;font-size:16px;text-align:center;line-height:1.2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--priS);color:var(--ink)}
.btn.danger{background:var(--red);color:#fff}
.link{background:none;border:0;padding:10px 4px;color:var(--pri);font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.link.sm{font-size:14px;padding:6px 2px}
.link.danger{color:var(--red)}
.link .ic{width:17px;height:17px}
.prog{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-size:14px;color:var(--mut)}
.prog .bars{display:flex;gap:5px;width:84px;flex:none}
.prog .bars i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.prog .bars i.on{background:var(--pri)}
.prog b{color:var(--ink);font-weight:700}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;min-height:88px;border-radius:18px;border:1.5px solid var(--line);background:var(--sf);color:var(--ink)}
.opt.rec{border-color:var(--pri)}
.oi{width:48px;height:48px;border-radius:14px;background:var(--priS);color:var(--pri);display:grid;place-items:center;flex:none}
.oi .ic{width:24px;height:24px}
.opt .tx{flex:1}
.opt b{display:block;font-size:18px;line-height:1.25}
.opt small{display:block;font-size:15px;color:var(--mut);line-height:1.35;margin-top:3px}
.opt>.ic{color:var(--mut)}
.badge{display:inline-block;font-size:13px;font-weight:700;color:var(--ok);background:var(--okS);border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:2px}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:620px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px 14px 16px;min-height:74px;border-radius:16px;border:1.5px solid var(--line);background:var(--sf)}
.card .tx{flex:1}
.card b{display:block;font-size:17px;line-height:1.25}
.card small{display:block;font-size:14px;color:var(--mut);line-height:1.35;margin-top:2px}
.card .ct{font-size:13px;color:var(--mut);white-space:nowrap}
.card .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.card .ck .ic{width:16px;height:16px;stroke-width:3}
.card[aria-pressed=true]{border-color:var(--pri);background:var(--priS)}
.card[aria-pressed=true] .ck{background:var(--pri);border-color:var(--pri);color:var(--priInk)}
.basebox{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--sf2);margin:20px 0 0;font-size:15px}
.basebox p{margin:0}
.bar{position:sticky;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.bar-in{max-width:848px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.bar .btn{flex:1 1 auto}
.bar .btn.line{flex:0 0 auto}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.search{flex:1 1 240px;position:relative}
.search .ic{position:absolute;left:14px;top:15px;color:var(--mut)}
.search input{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--sf);padding:0 14px 0 44px;font-size:16px;-webkit-appearance:none;appearance:none}
.cat{margin:0 0 20px}
.cat-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:0 0 8px;padding:0 2px}
.cat-h .cnt{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.cat-h .cnt.red{color:var(--red);font-weight:700}
.cat-h .link{margin-left:auto}
@media(max-width:520px){.cat-h.rv h3{flex-basis:100%}}
.grp{background:var(--sf);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.chk-row{display:flex;align-items:center;border-top:1px solid var(--line)}
.chk-row:first-child{border-top:0}
.chk{flex:1;display:flex;align-items:center;gap:12px;padding:11px 6px 11px 14px;min-height:58px;cursor:pointer;position:relative}
.chk input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chk .bx{width:24px;height:24px;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;flex:none;color:transparent}
.chk .bx .ic{width:15px;height:15px;stroke-width:3}
.chk input:checked+.bx{background:var(--pri);border-color:var(--pri);color:var(--priInk)}
.chk input:focus-visible+.bx{outline:3px solid var(--bar);outline-offset:2px}
.chk .tx b{display:block;font-weight:600;line-height:1.3}
.chk .tx small{display:block;color:var(--mut);font-size:14px;line-height:1.3}
.chk.off .tx{opacity:.5}
.chk-row .iconbtn{color:var(--mut);margin-right:4px}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:0 8px;background:var(--ambS);color:var(--amb)}
.addf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:16px;border-radius:16px;background:var(--sf2);margin:0 0 20px}
.addf .full{grid-column:1/-1}
@media(max-width:560px){.addf{grid-template-columns:minmax(0,1fr)}}
.fld label,.lbl{display:block;font-size:14px;font-weight:600;margin:0 0 6px;color:var(--ink)}
.fld input,.fld select,.usetools select{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--sf);padding:0 12px;font-size:16px}
.fld textarea{width:100%;min-height:200px;border-radius:12px;border:1.5px solid var(--line);background:var(--sf);padding:12px;font-size:16px;line-height:1.45;resize:vertical}
.fld+.fld{margin-top:12px}
.addf .fld+.fld{margin-top:0}
.fld .hint{display:block;font-size:13px;color:var(--mut);margin-top:5px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.two .fld+.fld{margin-top:0}
.boxcard{background:var(--sf);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin:0 0 22px}
.bxrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bxq b{display:block;font-size:17px;line-height:1.3}
.bxq small{display:block;color:var(--mut);font-size:14px}
.bxbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.bxbtns .btn{min-height:54px;padding:0 12px}
@media(max-width:400px){.bxbtns{grid-template-columns:minmax(0,1fr)}}
.mrow{padding:12px 14px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.nmb{border:0;background:none;padding:0;text-align:left;color:inherit;display:block;width:100%}
.nmb b{font-weight:600;line-height:1.3}
.nmb small{display:block;color:var(--mut);font-size:14px}
.pen{display:inline-block;vertical-align:-2px;margin-left:6px;color:var(--mut)}
.pen .ic{width:16px;height:16px}
.pair{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:10px}
.pair .lbl{font-size:13px;font-weight:600;color:var(--mut);margin:0 0 4px}
@media(min-width:720px){.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px}.pair{margin:0}}
.stp{display:inline-flex;align-items:stretch;border:1.5px solid var(--line);border-radius:12px;background:var(--sf);overflow:hidden;height:44px}
.stp button{width:44px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.stp button:active{background:var(--sf2)}
.stp input{width:56px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;background:transparent;text-align:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;padding:0}
.stp input::placeholder{color:var(--mut);font-weight:500}
.band{background:var(--band);color:var(--bandInk);padding:14px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.band-in{max-width:848px;margin:0 auto}
.band h1{color:var(--bandInk);margin:0 0 4px}
.band .meta{color:var(--bandMut);font-size:14px;margin:0 0 14px;overflow-wrap:anywhere}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin:0 0 14px}
.legend span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.d{width:10px;height:10px;border-radius:50%;display:inline-block}
.d.low{background:var(--tLow)}.d.at{background:var(--tAt)}.d.ok{background:var(--tOk)}.d.none{background:var(--tNone)}
.teeth{display:flex;flex-wrap:wrap;gap:4px}
.teeth i{display:block;width:var(--ts,18px);height:var(--ts,18px);cursor:pointer}
.teeth svg{width:100%;height:100%;fill:currentColor}
.teeth .ok{color:var(--tOk)}.teeth .at{color:var(--tAt)}.teeth .low{color:var(--tLow)}.teeth .none{color:var(--tNone)}
.teeth i:hover{transform:translateY(-2px)}
.useb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:440px;min-height:56px;margin:20px 0 0;border:0;border-radius:16px;background:var(--bandInk);color:var(--band);font-weight:800;font-size:17px}
.useb .ic{width:22px;height:22px;stroke-width:2.6}
.bandacts{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin:20px 0 0}
.bandacts .useb{flex:1 1 300px;margin:0}
.expw{position:relative;flex:0 0 auto}
.expb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:0 18px 0 20px;border:1.5px solid rgba(245,241,235,.55);border-radius:16px;background:rgba(255,255,255,.08);color:var(--bandInk);font-weight:800;font-size:17px;white-space:nowrap}
.expb:hover,.expb[aria-expanded=true]{background:rgba(255,255,255,.16)}
.expb .ic{width:22px;height:22px}
.expb .cr{width:18px;height:18px;transition:transform .15s}
.expb[aria-expanded=true] .cr{transform:rotate(180deg)}
.expmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:max-content;min-width:100%;max-width:min(380px,calc(100vw - 32px));background:var(--sf);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 34px rgba(6,18,26,.28);padding:6px;animation:pop .14s ease-out}
@keyframes pop{from{transform:translateY(-4px)}to{transform:none}}
.expmenu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px 10px 10px;min-height:62px;border:0;background:none;border-radius:12px;color:var(--ink)}
.expmenu button:hover,.expmenu button:focus-visible{background:var(--sf2)}
.expmenu b{display:block;font-size:16px;line-height:1.25}
.expmenu small{display:block;font-size:14px;color:var(--mut)}
@media(max-width:560px){.bandacts .useb,.expw{flex:1 1 100%;max-width:none}.expmenu{left:0;right:0;width:auto;max-width:none}}
.panel{padding-top:18px;padding-bottom:48px}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--priS);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:15px}
.tip p{margin:0;flex:1}
.alarm{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:16px;border:1.5px solid var(--red);background:var(--redS);color:var(--ink);margin:0 0 14px;min-height:68px;font-size:16px;line-height:1.4}
.alarm .ai{width:38px;height:38px;border-radius:50%;background:var(--red);color:var(--redS);display:grid;place-items:center;flex:none}
.alarm .at{flex:1}
.alarm small{display:block;font-size:14px;color:var(--mut);margin-top:2px}
.alarm .chev{color:var(--red);flex:none}
.alarm.calm{border-color:var(--ok);background:var(--okS)}
.alarm.calm .ai{background:var(--ok);color:var(--okS)}
.ei{width:40px;height:40px;border-radius:11px;background:var(--priS);color:var(--pri);display:grid;place-items:center;flex:none}
.srow{position:sticky;top:calc(max(10px,env(safe-area-inset-top)) + 54px);z-index:15;background:var(--bg);display:flex;gap:10px;padding:8px 0;margin:0 0 4px}
.srow .search{flex:1 1 auto}
.addb{flex:none;min-height:50px;padding:0 16px}
@media(max-width:430px){.addb span{display:none}.addb{width:50px;padding:0}}
.grow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:4px 0 16px}
.glab{font-size:14px;font-weight:700;color:var(--mut)}
.seg{display:inline-flex;background:var(--sf2);border-radius:13px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:10px;padding:0 13px;min-height:42px;font-size:15px;font-weight:600;color:var(--mut);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(10,30,45,.14)}
.sortnote{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;padding:10px 14px;margin:0 0 10px;border-radius:14px;background:var(--redS);font-size:15px;font-weight:600}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.grp>.row:first-child{border-top:0}
.row .main{border:0;background:none;padding:2px 0;text-align:left;display:block;width:100%;color:var(--ink)}
.row .main b{display:block;font-weight:600;line-height:1.3}
.row .main small{display:block;color:var(--mut);font-size:14px;line-height:1.35}
.meter{display:block;position:relative;height:6px;border-radius:6px;background:var(--sf2);margin-top:9px;max-width:320px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--bar)}
.meter::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:var(--mut)}
.row.low .meter i{background:var(--red)}
.row.at .meter i{background:var(--amb)}
.row.low .stp input{color:var(--red)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.pill{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.low{background:var(--redS);color:var(--red)}.pill.at{background:var(--ambS);color:var(--amb)}.pill.ok{background:var(--okS);color:var(--ok)}.pill.none{background:var(--sf2);color:var(--mut)}
.row.flash{animation:flash 1.8s ease}

  </main>

function stepper(it,f){const lab=(f==='min'?'Mínimo de ':'Stock de ')+it.name;const v=+it[f]||0;return `<div class="stp"><button type="button" data-a="dec" data-id="${it.id}" data-f="${f}" aria-label="Restar 1 al ${esc(lab)}">${I.minus}</button><input type="text" inputmode="decimal" data-id="${it.id}" data-f="${f}" value="${v||screen()==='panel'?fmt(v):''}" placeholder="${f==='min'?'—':'0'}" aria-label="${esc(lab)}" autocomplete="off"><button type="button" data-a="inc" data-id="${it.id}" data-f="${f}" aria-label="Sumar 1 al ${esc(lab)}">${I.plus}</button></div>`;}
const minsList=()=>ui.minsEdit?C.items:(C.draft?C.draft.cands.filter(c=>c.on):[]);

function boxCard(list){const est=C.minMode==='est',own=C.minMode==='own';return `<section class="boxcard"><div class="bxrow"><div class="bxq"><b>¿Cuántos box tiene la clínica?</b><small>Se usa para estimar mínimos, si lo pides.</small></div><div class="stp"><button type="button" data-a="box-dec" aria-label="Un box menos">${I.minus}</button><input type="text" id="boxes" inputmode="numeric" value="${C.boxes}" aria-label="Cantidad de box" autocomplete="off"><button type="button" data-a="box-inc" aria-label="Un box más">${I.plus}</button></div></div><div class="bxbtns"><button type="button" class="btn${est?'':' line'}" data-a="min-est" aria-pressed="${est}">Asignar mínimos estimados</button><button type="button" class="btn${own?'':' line'}" data-a="min-own" aria-pressed="${own}">Los pongo yo</button></div><p class="note" id="min-note">${minsNote(list)}</p></section>`;}

function bandIn(c){

function alarmHTML(c){

const expMenuHTML=c=>`<div class="expw"><button type="button" class="expb" id="exp-btn" data-a="exp-menu" aria-haspopup="menu" aria-expanded="${!!ui.expOpen}" aria-controls="exp-menu">${I.share}<span>Exportar inventario</span>${CARET}</button>${ui.expOpen?`<div class="expmenu" id="exp-menu" role="menu" aria-labelledby="exp-btn"><button type="button" role="menuitem" data-a="exp-miss"><span class="ei">${I.cart}</span><span><b>Exportar lo que me falta</b><small>${c.low?`${c.low} ${plural(c.low,'insumo','insumos')} bajo el mínimo`:'Nada por reponer'}</small></span></button><button type="button" role="menuitem" data-a="exp-all"><span class="ei">${I.file}</span><span><b>Exportar inventario completo</b><small>${C.items.length} ${plural(C.items.length,'insumo','insumos')}</small></span></button></div>`:''}</div>`;

const subTxt=(it,pct)=>esc((it.unit?it.unit+' · ':'')+(it.min>0?'mín. '+fmt(it.min):'sin mínimo')+(ui.sort==='cov'&&pct!=null?' · '+pct+' %':''));

const pdfTxt=s=>String(s??'').replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'").replace(/[–—]/g,'-').replace(/…/g,'...').replace(/ /g,' ');
function buildPdf(kind){
  const miss=kind==='miss',{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4',compress:true});
  doc.setLineHeightFactor(1.25);
  const W=210,H=297,M=14,IW=W-2*M,BOT=H-17,T=pdfTxt;
  const CL={blue:[22,63,92],ink:[15,39,56],mut:[82,103,122],line:[221,213,201],tint:[232,241,244],red:[180,42,32],amb:[138,90,6],ok:[31,110,104],white:[255,255,255],pale:[190,212,226]};
  const col=k=>doc.setTextColor(...CL[k]);
  const now=new Date();
  const fecha=now.toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'})+' · '+now.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  const title=miss?'Lista de compra: lo que falta':'Inventario completo';
  const items=miss?C.items.filter(i=>status(i)==='low'):C.items.slice();
  const c=counts(C.items);
  doc.setFillColor(...CL.blue);doc.rect(0,0,W,24,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(13);col('white');doc.text(T(C.name),M,11);
  doc.setFont('helvetica','normal');doc.setFontSize(9);col('pale');doc.text('Inventario Dental',M,17);
  col('white');doc.text(T(fecha),W-M,11,{align:'right'});col('pale');doc.text(T(A.email||''),W-M,17,{align:'right'});
  let y=37;
  doc.setFont('helvetica','bold');doc.setFontSize(20);col('ink');doc.text(T(title),M,y);y+=7.5;
  doc.setFont('helvetica','normal');doc.setFontSize(10);col('mut');
  doc.text(T(miss?`${items.length} ${plural(items.length,'insumo','insumos')} bajo el mínimo. "Comprar" son los envases que faltan para llegar al mínimo.`:`${C.items.length} insumos · ${C.boxes} box · ${c.low} bajo el mínimo · ${c.at} en el mínimo · ${c.ok} sobre el mínimo${c.none?` · ${c.none} sin mínimo`:''}`),M,y);
  y+=8;
  const cols=miss?[{k:'box',l:'',w:8},{k:'name',l:'Insumo',w:78},{k:'unit',l:'Presentación',w:38},{k:'stock',l:'Stock',w:18,r:1},{k:'min',l:'Mínimo',w:20,r:1},{k:'buy',l:'Comprar',w:20,r:1}]:[{k:'name',l:'Insumo',w:77},{k:'unit',l:'Presentación',w:38},{k:'min',l:'Mínimo',w:19,r:1},{k:'stock',l:'Stock',w:18,r:1},{k:'st',l:'Estado',w:30}];
  const LH=4.19,PAD=1.85;
  const headRow=()=>{doc.setFont('helvetica','bold');doc.setFontSize(8.5);col('mut');let x=M;cols.forEach(cl=>{if(cl.l)doc.text(T(cl.l),cl.r?x+cl.w-2:x+(cl.k==='st'?5:2),y+4,cl.r?{align:'right'}:undefined);x+=cl.w;});y+=6;doc.setDrawColor(...CL.ink);doc.setLineWidth(.35);doc.line(M,y,W-M,y);y+=.5;};
  const newPage=()=>{doc.addPage();y=15;doc.setFont('helvetica','bold');doc.setFontSize(9.5);col('ink');doc.text(T(C.name+' · '+title),M,y);doc.setFont('helvetica','normal');col('mut');doc.text(T(fecha),W-M,y,{align:'right'});y+=5;headRow();};
  headRow();
  groupItems(items,C.group==='none'?'cat':C.group).forEach(g=>{
    if(y+7+LH+PAD*2>BOT)newPage();
    doc.setFillColor(...CL.tint);doc.rect(M,y,IW,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(9.5);col('blue');doc.text(T(`${g.name} (${g.items.length})`),M+2,y+4.8);y+=7;
    g.items.forEach(it=>{
      const st=status(it);
      const vals={name:it.name,unit:it.unit||'-',min:it.min>0?fmt(it.min):'-',stock:fmt(it.stock),st:PILL[st],buy:fmt(buyQty(it))};
      doc.setFontSize(9.5);
      const isBold=cl=>cl.k==='buy'||cl.k==='st'||(cl.k==='stock'&&st==='low');
      const lines=cols.map(cl=>{if(cl.k==='box')return [''];doc.setFont('helvetica',isBold(cl)?'bold':'normal');return doc.splitTextToSize(T(vals[cl.k]),cl.w-4);});
      const h=Math.max(...lines.map(l=>l.length))*LH+PAD*2;
      if(y+h>BOT)newPage();
      let x=M;
      cols.forEach((cl,i)=>{
        if(cl.k==='box'){doc.setDrawColor(...CL.mut);doc.setLineWidth(.3);doc.rect(x+2,y+PAD+.3,3.6,3.6);}
        else{doc.setFont('helvetica',isBold(cl)?'bold':'normal');col(cl.k==='st'?(st==='low'?'red':st==='at'?'amb':st==='ok'?'ok':'mut'):(cl.k==='stock'&&st==='low')?'red':cl.k==='unit'?'mut':'ink');doc.text(lines[i],cl.r?x+cl.w-2:x+(cl.k==='st'?5:2),y+PAD+3.1,cl.r?{align:'right'}:undefined);}
        x+=cl.w;
      });
      y+=h;doc.setDrawColor(...CL.line);doc.setLineWidth(.2);doc.line(M,y,W-M,y);
    });
    y+=3;
  });
  if(miss){if(y+10>BOT)newPage();doc.setFont('helvetica','bold');doc.setFontSize(10);col('ink');doc.text(T(`Total: ${items.length} ${plural(items.length,'insumo','insumos')} por reponer.`),M,y+5);}
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);col('mut');doc.text(T('Inventario Dental · '+C.name),M,H-8);doc.text(`Página ${i} de ${n}`,W-M,H-8,{align:'right'});}
  return doc.output('blob');
}
const pdfName=k=>(k==='miss'?'Faltantes':'Inventario')+'_'+fileTag(C.name)+'_'+today()+'.pdf';

  groupItems(items,C.group).forEach(g=>{if(C.group!=='none')out.push(b(g.name));g.items.forEach(it=>{const u=it.unit?` (${it.unit})`:'';if(miss)out.push(`• ${it.name}${u}: comprar ${fmt(buyQty(it))} · tengo ${fmt(it.stock)}, mín. ${fmt(it.min)}`);else out.push(`• ${it.name}${u}: ${fmt(it.stock)}${it.min>0?` / mín. ${fmt(it.min)}`:''}${status(it)==='low'?' · bajo el mínimo':''}`);});out.push('');});

function exportSheet(kind){
  const miss=kind==='miss',items=miss?C.items.filter(i=>status(i)==='low'):C.items;

    if(['xlsx','xlsm'].includes(ext)){const sheets=parseXlsx(await unzip(await f.arrayBuffer()));if(!sheets.length)throw{msg:'El Excel no tiene datos.'};return startMapping({fname:name,src:'xlsx',sheets});}
    if(ext==='docx')return startMapping({fname:name,src:'docx',rows:parseDocx(await unzip(await f.arrayBuffer()))});
    if(ext==='pdf'||type==='application/pdf')return startMapping({fname:name,src:'pdf',rows:await parsePdf(await f.arrayBuffer())});
    if(['csv','tsv','txt'].includes(ext)||/^text\//.test(type))return startMapping({fname:name,src:'text',rows:parseText(await f.text())});
    if(/^image\//.test(type)||['jpg','jpeg','png','webp','heic'].includes(ext))throw{msg:'Esta app no lee fotos. Usa Excel, CSV, PDF con texto o Word, o pega la lista.'};
    if(ext==='xls')throw{msg:'Ese Excel es del formato antiguo (.xls). Ábrelo y guárdalo como .xlsx, o copia las celdas y usa «Pegar una lista».'};
    if(ext==='doc')throw{msg:'Ese Word es del formato antiguo (.doc). Guárdalo como .docx, o copia el texto y usa «Pegar una lista».'};
    if(['ods','numbers','pages'].includes(ext))throw{msg:'Expórtalo como Excel (.xlsx) o CSV, o copia y pega la lista.'};
    throw{msg:'No reconocemos ese tipo de archivo. Usa Excel, CSV, PDF, Word, texto, o pega la lista.'};
  }catch(e){impError(e&&e.msg?e:{msg:'No pudimos leer ese archivo.'});}
}

  if(f.id==='f-paste'){const rows=parseText(fd.get('text'));if(!rows.length){err('p-err','Pega al menos un insumo.');return;}startMapping({fname:'Lista pegada',src:'paste',rows});return;}
  const name=String(fd.get('name')||'').trim();
  if(f.id==='f-ren'){if(!name){err('r-err','Escribe el nombre del insumo.');return;}const it=findItem(f.dataset.id);if(it){it.name=name.slice(0,80);it.unit=String(fd.get('unit')||'').trim().slice(0,40);}closeSheet();persist();rerender();toast('Nombre actualizado.');return;}
  if(f.id==='f-add'||f.id==='f-item'){
    const eid=f.id==='f-add'?'a-err':'i-err';
    if(!name){err(eid,'Escribe el nombre del insumo.');return;}
    const cm=matchCatalog(name);
    let cat=fd.get('cat');if(cat==='__new'){const cn=String(fd.get('catnew')||'').trim();if(!cn){err(eid,'Escribe el nombre de la nueva categoría.');return;}cat=ensureCat(cn);}
    const esp=fd.get('esp');
    const g={cat:cat!=null?String(cat):null,esp:esp!=null?String(esp):null};
    if(g.cat)ui.lastCat=g.cat;if(g.esp)ui.lastEsp=g.esp;
    if(f.id==='f-add'){C.draft.cands.push({id:newId(),cid:null,name,unit:String(fd.get('unit')||'').trim(),cat:g.cat||(cm&&cm.cat)||guessCat(name)||'otr',esp:g.esp||(cm?specOf(cm,C.specs):'otr'),min:0,stock:0,own:true,on:true,sug:cm?cm.min:0,fx:cm?cm.fx:false,minMan:false});persist();rerender();const n=$('#a-name');if(n){n.value='';n.focus();}toast('Agregado: '+name);return;}
    const data={name,unit:String(fd.get('unit')||'').trim(),min:num(fd.get('min')),stock:num(fd.get('stock'))};
    if(g.cat)data.cat=g.cat;if(g.esp)data.esp=g.esp;
    let it=f.dataset.id?C.items.find(x=>x.id===f.dataset.id):null;
    if(it){if(data.min!==it.min)it.minMan=true;Object.assign(it,data);}else{it=Object.assign({id:newId(),cid:null,own:true,cat:(cm&&cm.cat)||guessCat(name)||'otr',esp:cm?specOf(cm,C.specs):'otr',sug:cm?cm.min:0,fx:cm?cm.fx:false,minMan:data.min>0},data);C.items.push(it);}
    closeSheet();persist();rerender();flashRow(it.id);toast(f.dataset.id?'Cambios guardados.':'Insumo agregado.');
  }
});

/* ---------------- Inicio ---------------- */
function boot(){
  const e=Local.session();
  if(e){A=Local.load(e)||freshAcc(e);A.email=e;}
  render();
  try{if(history.state&&history.state.inv){guard=true;dropGuard();}}catch(_){}
  if(/^https?:$/.test(location.protocol)){
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(_){}
  }
}
boot();
}
</script>
